<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8054e9"><title>Fayrouz 1.1.46 | فيروز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>/* Critical first-paint lock: keep every app element hidden until password unlock. */
    html,body{min-height:100%;margin:0}
    body.auth-locked{min-height:100vh;overflow:hidden;background:#f4effb!important}
    body.auth-locked> :not(#authScreen){display:none!important}
    body.auth-locked>.app-shell,
    .app-shell[hidden]{display:none!important}
    body.auth-locked>#authScreen{display:grid!important;position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;min-height:100vh!important;z-index:2147483647!important;margin:0!important;padding:0!important}
    body.auth-locked>#authScreen>.auth-card{width:100%!important;max-width:none!important;height:100%!important;min-height:100%!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-locked">
<div class="app-shell" id="appShell" hidden>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">F</div><div><strong>Fayrouz</strong><small>مساحتي الخاصة</small></div></div>
    <div class="side-label">القائمة الرئيسية</div>
    <nav id="nav">
      <button class="nav-item active" data-page="home"><span>⌂</span>الرئيسية</button>
      <button class="nav-item" data-page="tasks"><span>✓</span>مهامي</button>
      <button class="nav-item" data-page="notes"><span>✎</span>مذكراتي</button>
      <button class="nav-item" data-page="wird"><span>۞</span>وردي</button>
      <button class="nav-item" data-page="settings"><span>⚙</span>الإعدادات</button>
    </nav>
    <div class="sidebar-bottom"><div class="side-quote">«الأشياء الجميلة تبدأ بخطوة صغيرة»</div></div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div><div class="eyebrow" id="todayLabel">مساحتكِ اليوم</div><h1 id="pageTitle">أهلاً بكِ في فيروز <span>✿</span></h1></div><div class="top-actions"><div class="clock"><strong id="clockTime">--:--</strong><small id="clockDate">---</small></div><button class="avatar theme-mode-toggle" id="themeModeToggle" type="button" aria-label="التبديل إلى الوضع الداكن" title="تغيير المظهر"><span class="theme-mode-icon" aria-hidden="true">☾</span></button></div></header>
    <section id="content" class="content"></section>
    <footer>Fayrouz <span>•</span> مساحة صغيرة لكل ما يهمكِ</footer>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><h2 id="modalTitle">إضافة</h2><form id="itemForm"><div id="formFields"></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">إلغاء</button><button class="btn primary" type="submit">حفظ</button></div></form></div></div>
<div id="mediaViewer" class="media-viewer hidden" role="dialog" aria-modal="true" aria-label="مشغل الصور والفيديوهات">
  <div class="media-viewer-panel"><div class="media-viewer-top"><div><strong id="mediaViewerTitle">المعرض</strong><small id="mediaViewerCount"></small></div><button id="closeMediaViewer" class="viewer-close" type="button" aria-label="إغلاق">×</button></div>
  <div id="mediaViewerBody" class="media-viewer-body"></div>
  <div class="media-viewer-controls"><button id="mediaPrev" class="btn ghost" type="button">→ السابق</button><button id="mediaViewerDownload" class="btn primary" type="button">⬇ تحميل الملف</button><button id="mediaNext" class="btn ghost" type="button">التالي ←</button></div></div>
</div>
<div id="deleteConfirm" class="delete-confirm hidden" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><div class="delete-confirm-card"><div class="delete-confirm-icon">!</div><p class="delete-kicker">تأكيد الحذف</p><h2 id="deleteTitle">هل تريدين حذف هذا العنصر؟</h2><p id="deleteDescription">سيتم حذف العنصر نهائياً ولا يمكن التراجع عن هذه الخطوة.</p><div class="delete-confirm-actions"><button type="button" class="btn ghost" id="cancelDelete">إلغاء</button><button type="button" class="btn danger" id="confirmDelete">تأكيد الحذف</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body></html>
